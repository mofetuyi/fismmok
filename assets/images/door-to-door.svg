<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dtdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#1E6FD9"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#dtdBg)"/>
  
  <!-- Global Transit Route Arc -->
  <path d="M80 280 C 180 100, 380 90, 500 250" stroke="#FF6B00" stroke-width="4" stroke-dasharray="10 8" fill="none"/>

  <!-- Origin Pin (Global Port) -->
  <g transform="translate(70, 240)">
    <circle cx="15" cy="15" r="14" fill="#38BDF8"/>
    <circle cx="15" cy="15" r="6" fill="#FFFFFF"/>
    <text x="-10" y="45" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">Global Origin</text>
  </g>

  <!-- Destination Pin (Apapa / Lagos / Nigeria) -->
  <g transform="translate(485, 210)">
    <!-- Big glowing drop pin -->
    <path d="M20 0 C 8 0, 0 9, 0 20 C 0 35, 20 60, 20 60 C 20 60, 40 35, 40 20 C 40 9, 32 0, 20 0 Z" fill="#FF6B00"/>
    <circle cx="20" cy="20" r="8" fill="#FFFFFF"/>
    <text x="-25" y="80" font-family="'Inter', sans-serif" font-weight="800" font-size="12" fill="#FFFFFF">Your Doorstep (Nigeria)</text>
  </g>

  <!-- Central Express Delivery Van & Cargo Box -->
  <g transform="translate(230, 160)">
    <!-- Delivery Van -->
    <rect x="0" y="30" width="100" height="40" rx="5" fill="#FFFFFF"/>
    <path d="M100 45 L125 45 L135 60 L135 70 L100 70 Z" fill="#FFFFFF"/>
    <rect x="105" y="48" width="18" height="12" rx="2" fill="#0A1F44"/>
    <rect x="15" y="40" width="60" height="15" rx="2" fill="#1E6FD9"/>
    <text x="18" y="51" font-family="'Poppins', sans-serif" font-weight="800" font-size="8" fill="#FFFFFF">FISMMOK EXPRESS</text>
    <circle cx="25" cy="72" r="10" fill="#0A1F44"/>
    <circle cx="25" cy="72" r="4" fill="#E2E8F0"/>
    <circle cx="110" cy="72" r="10" fill="#0A1F44"/>
    <circle cx="110" cy="72" r="4" fill="#E2E8F0"/>
    
    <!-- Verified Badge -->
    <circle cx="70" cy="15" r="18" fill="#10B981"/>
    <path d="M63 15 L68 20 L77 10" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
