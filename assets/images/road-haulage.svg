<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="haulSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="60%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="100%" stop-color="#0A1F44"/>
    </linearGradient>
    <linearGradient id="cntnrGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#haulSky)"/>
  <!-- Highway Perspective -->
  <polygon points="0,320 600,320 600,400 0,400" fill="url(#roadGrad)"/>
  <line x1="20" y1="365" x2="120" y2="365" stroke="#FDE047" stroke-width="4"/>
  <line x1="180" y1="365" x2="280" y2="365" stroke="#FDE047" stroke-width="4"/>
  <line x1="340" y1="365" x2="440" y2="365" stroke="#FDE047" stroke-width="4"/>
  <line x1="500" y1="365" x2="600" y2="365" stroke="#FDE047" stroke-width="4"/>
  
  <!-- Modern Heavy Haulage Truck -->
  <g transform="translate(40, 140)">
    <!-- Flatbed Chassis -->
    <rect x="20" y="145" width="480" height="15" rx="3" fill="#1E293B"/>
    <rect x="25" y="152" width="470" height="5" fill="#94A3B8"/>
    <!-- 40ft Shipping Container -->
    <rect x="30" y="30" width="350" height="115" rx="4" fill="url(#cntnrGrad)"/>
    <!-- Container Ribs -->
    <g stroke="rgba(0,0,0,0.2)" stroke-width="3">
      <line x1="60" y1="30" x2="60" y2="145"/>
      <line x1="90" y1="30" x2="90" y2="145"/>
      <line x1="120" y1="30" x2="120" y2="145"/>
      <line x1="150" y1="30" x2="150" y2="145"/>
      <line x1="180" y1="30" x2="180" y2="145"/>
      <line x1="210" y1="30" x2="210" y2="145"/>
      <line x1="240" y1="30" x2="240" y2="145"/>
      <line x1="270" y1="30" x2="270" y2="145"/>
      <line x1="300" y1="30" x2="300" y2="145"/>
      <line x1="330" y1="30" x2="330" y2="145"/>
    </g>
    <!-- Container Branding -->
    <rect x="100" y="65" width="210" height="40" rx="3" fill="#FFFFFF" opacity="0.95"/>
    <text x="110" y="86" font-family="'Poppins', sans-serif" font-weight="900" font-size="14" fill="#0A1F44">FISMMOK LOGISTIX</text>
    <text x="110" y="99" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#FF6B00">INTERSTATE HAULAGE DIVISION</text>

    <!-- Truck Tractor Cab -->
    <path d="M380 145 L380 40 Q 380 20 405 20 L455 20 Q 480 30 495 70 L515 110 L515 145 Z" fill="url(#cabGrad)"/>
    <!-- Windshield -->
    <polygon points="415,30 460,30 485,75 425,75" fill="#38BDF8" opacity="0.85"/>
    <!-- Side Window -->
    <rect x="390" y="45" width="25" height="30" rx="2" fill="#38BDF8" opacity="0.85"/>
    <!-- Headlights & Chrome Grille -->
    <rect x="495" y="115" width="20" height="15" rx="3" fill="#F8FAFC"/>
    <rect x="502" y="118" width="10" height="9" rx="2" fill="#FDE047"/>
    <rect x="460" y="95" width="45" height="40" rx="4" fill="#334155"/>
    <line x1="465" y1="105" x2="500" y2="105" stroke="#94A3B8" stroke-width="2"/>
    <line x1="465" y1="115" x2="500" y2="115" stroke="#94A3B8" stroke-width="2"/>
    <line x1="465" y1="125" x2="500" y2="125" stroke="#94A3B8" stroke-width="2"/>

    <!-- Wheels (Double Axles) -->
    <!-- Rear Wheels 1 & 2 -->
    <circle cx="70" cy="160" r="22" fill="#020617"/>
    <circle cx="70" cy="160" r="10" fill="#94A3B8"/>
    <circle cx="120" cy="160" r="22" fill="#020617"/>
    <circle cx="120" cy="160" r="10" fill="#94A3B8"/>
    <!-- Trailer Center Axle -->
    <circle cx="340" cy="160" r="22" fill="#020617"/>
    <circle cx="340" cy="160" r="10" fill="#94A3B8"/>
    <!-- Cab Drive Wheels -->
    <circle cx="410" cy="160" r="22" fill="#020617"/>
    <circle cx="410" cy="160" r="10" fill="#94A3B8"/>
    <!-- Front Steering Wheel -->
    <circle cx="485" cy="160" r="22" fill="#020617"/>
    <circle cx="485" cy="160" r="10" fill="#94A3B8"/>
  </g>
</svg>
