<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1F44"/>
      <stop offset="100%" stop-color="#0F2D6B"/>
    </linearGradient>
    <linearGradient id="stampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#bgCust)"/>
  <!-- Circular radar / security grid background -->
  <circle cx="300" cy="200" r="160" stroke="#1E6FD9" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.3"/>
  <circle cx="300" cy="200" r="120" stroke="#1E6FD9" stroke-width="1.5" fill="none" opacity="0.4"/>
  <circle cx="300" cy="200" r="80" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8 8" fill="none" opacity="0.5"/>

  <!-- Official Clearance Dossier Folder / Documents -->
  <g transform="translate(150, 70)">
    <!-- Backing Folder -->
    <rect x="0" y="20" width="300" height="230" rx="8" fill="#1E293B"/>
    <!-- Front Document Sheet -->
    <rect x="20" y="0" width="260" height="230" rx="6" fill="#F8FAFC"/>
    
    <!-- Document Header -->
    <rect x="40" y="25" width="40" height="40" rx="4" fill="#0A1F44"/>
    <polygon points="50,55 60,35 70,55" fill="#FF6B00"/>
    <text x="90" y="42" font-family="'Poppins', sans-serif" font-weight="800" font-size="13" fill="#0A1F44">NIGERIAN CUSTOMS SERVICE</text>
    <text x="90" y="56" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#64748B">PAAR &amp; FAST-TRACK CLEARANCE</text>

    <!-- Document Text Lines -->
    <line x1="40" y1="85" x2="240" y2="85" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="40" y1="105" x2="200" y2="105" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="120" x2="220" y2="120" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="40" y1="135" x2="180" y2="135" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round"/>

    <!-- Barcode -->
    <g transform="translate(40, 160)" stroke="#1E293B" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="35"/>
      <line x1="4" y1="0" x2="4" y2="35" stroke-width="4"/>
      <line x1="12" y1="0" x2="12" y2="35"/>
      <line x1="18" y1="0" x2="18" y2="35" stroke-width="3"/>
      <line x1="26" y1="0" x2="26" y2="35"/>
      <line x1="32" y1="0" x2="32" y2="35" stroke-width="4"/>
      <line x1="42" y1="0" x2="42" y2="35"/>
      <line x1="48" y1="0" x2="48" y2="35" stroke-width="3"/>
      <line x1="58" y1="0" x2="58" y2="35"/>
    </g>

    <!-- Prominent "CLEARED &amp; RELEASED" Stamp -->
    <g transform="translate(130, 130) rotate(-15)">
      <rect x="0" y="0" width="145" height="55" rx="6" fill="none" stroke="#10B981" stroke-width="4" stroke-dasharray="6 4"/>
      <text x="14" y="26" font-family="'Poppins', sans-serif" font-weight="900" font-size="15" fill="#10B981" letter-spacing="1">CLEARED</text>
      <text x="14" y="44" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#059669" letter-spacing="1.5">APAPA PORT TERMINAL</text>
    </g>
  </g>

  <!-- Golden Accredited Seal Badge -->
  <g transform="translate(420, 240)">
    <circle cx="50" cy="50" r="45" fill="#FF6B00"/>
    <circle cx="50" cy="50" r="38" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="50,22 58,38 76,41 62,53 66,71 50,62 34,71 38,53 24,41 42,38" fill="#FFFFFF"/>
  </g>
</svg>
