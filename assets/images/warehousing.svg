<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="whBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="12" fill="url(#whBg)"/>
  <!-- Warehouse Floor -->
  <polygon points="0,260 600,260 600,400 0,400" fill="url(#floorGrad)"/>
  
  <!-- High Bay Industrial Racking Shelves -->
  <g stroke="#64748B" stroke-width="4">
    <!-- Uprights left rack -->
    <line x1="80" y1="60" x2="80" y2="300"/>
    <line x1="220" y1="60" x2="220" y2="300"/>
    <!-- Shelves left -->
    <line x1="80" y1="120" x2="220" y2="120" stroke="#FF6B00" stroke-width="5"/>
    <line x1="80" y1="180" x2="220" y2="180" stroke="#FF6B00" stroke-width="5"/>
    <line x1="80" y1="240" x2="220" y2="240" stroke="#FF6B00" stroke-width="5"/>

    <!-- Uprights right rack -->
    <line x1="380" y1="60" x2="380" y2="300"/>
    <line x1="520" y1="60" x2="520" y2="300"/>
    <!-- Shelves right -->
    <line x1="380" y1="120" x2="520" y2="120" stroke="#FF6B00" stroke-width="5"/>
    <line x1="380" y1="180" x2="520" y2="180" stroke="#FF6B00" stroke-width="5"/>
    <line x1="380" y1="240" x2="520" y2="240" stroke="#FF6B00" stroke-width="5"/>
  </g>

  <!-- Cargo Pallets & Boxes on shelves -->
  <!-- Left rack goods -->
  <rect x="95" y="75" width="50" height="42" rx="3" fill="#0284C7"/>
  <rect x="155" y="80" width="50" height="37" rx="3" fill="#F59E0B"/>
  <rect x="95" y="135" width="110" height="42" rx="3" fill="#1E6FD9"/>
  <rect x="95" y="195" width="55" height="42" rx="3" fill="#10B981"/>
  <rect x="155" y="195" width="50" height="42" rx="3" fill="#E2E8F0"/>

  <!-- Right rack goods -->
  <rect x="395" y="75" width="110" height="42" rx="3" fill="#FF6B00"/>
  <rect x="395" y="135" width="50" height="42" rx="3" fill="#3B82F6"/>
  <rect x="455" y="140" width="50" height="37" rx="3" fill="#10B981"/>
  <rect x="395" y="195" width="110" height="42" rx="3" fill="#64748B"/>

  <!-- Forklift Center -->
  <g transform="translate(250, 230)">
    <!-- Body -->
    <rect x="25" y="40" width="55" height="35" rx="5" fill="#F59E0B"/>
    <!-- Counterweight back -->
    <path d="M15 50 Q 15 40 25 40 L 25 75 L 15 75 Z" fill="#DC2626"/>
    <!-- Cabin cage -->
    <rect x="35" y="15" width="30" height="25" fill="none" stroke="#0F172A" stroke-width="3"/>
    <!-- Mast & Forks -->
    <line x1="85" y1="5" x2="85" y2="75" stroke="#475569" stroke-width="4"/>
    <line x1="85" y1="65" x2="110" y2="65" stroke="#475569" stroke-width="4"/>
    <!-- Box on fork -->
    <rect x="88" y="35" width="28" height="28" rx="2" fill="#38BDF8"/>
    <!-- Wheels -->
    <circle cx="30" cy="78" r="10" fill="#0F172A"/>
    <circle cx="30" cy="78" r="4" fill="#94A3B8"/>
    <circle cx="75" cy="78" r="10" fill="#0F172A"/>
    <circle cx="75" cy="78" r="4" fill="#94A3B8"/>
  </g>
</svg>
