<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Crisp Rounded Card Background -->
  <rect x="12" y="12" width="488" height="488" rx="64" fill="#FFFFFF" stroke="#001788" stroke-width="16"/>

  <!-- Left Slanted Chevron / Emblem -->
  <polygon points="40,70 100,70 60,220 20,220" fill="#001788"/>

  <!-- Brand Name: FISMMOK -->
  <text x="115" y="165" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="900" fill="#001788" letter-spacing="1">FISMMOK</text>

  <!-- Cyan Banner -->
  <polygon points="20,230 492,230 450,460 20,460" fill="#09ACF6"/>

  <!-- Subtitle: LOGISTIX -->
  <text x="45" y="325" font-family="'Poppins', 'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="1">LOGISTIX</text>

  <!-- Subtitle: NIGERIA LIMITED -->
  <text x="45" y="405" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">NIGERIA LIMITED</text>
</svg>
